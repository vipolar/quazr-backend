spring.datasource.url=jdbc:postgresql://${BE_DATABASE_HOST}:${BE_DATABASE_PORT}/${BE_DATABASE_NAME}?stringtype=unspecified
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.password=${BE_DATABASE_PASSWORD}
spring.datasource.username=${BE_DATABASE_USER}
server.servlet.context-path=${BE_CONTEXT_PATH}
spring.jpa.show-sql=${BE_JPA_SHOW_SQL}
server.port=${BE_PORT}

jwt.auth.converter.resource-id=quazr-web
jwt.auth.converter.principle-attribute=preferred_username
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:7080/realms/quazr
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:7080/realms/quazr/protocol/openid-connect/certs
logging.level.org.springframework.security=DEBUG

#LEAVE THESE ALONE!
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.application.name=quazr-backend

spring.devtools.restart.trigger-file=watcherTrigger.txt
spring.devtools.restart.enabled=true

#rustFS confguration
rustfs.url=http://${BE_BUCKET_HOST}:${BE_BUCKET_PORT}
rustfs.bucket.name=${BE_IMAGES_BUCKET}
rustfs.secret.key=${BE_BUCKET_PASS}
rustfs.access.key=${BE_BUCKET_KEY}

rabbitmq.images.exchange=quazr-images-exchange

rabbitmq.images.tasks.queue=quazr-images-tasks-queue
rabbitmq.images.tasks.routing-key=quazr-images-tasks-routing-key

rabbitmq.images.tasks.successes.queue=quazr-images-tasks-successes-queue
rabbitmq.images.tasks.successes.routing-key=quazr-images-tasks-successes-routing-key

rabbitmq.images.tasks.failures.queue=quazr-images-tasks-failures-queue
rabbitmq.images.tasks.failures.routing-key=quazr-images-tasks-failures-routing-key

rabbitmq.images.dlq.routing-key=quazr-images-dlq-routing-key
rabbitmq.images.dlq.exchange=quazr-images-dlq-exchange
rabbitmq.images.dlq.queue=quazr-images-dlq-queue

spring.rabbitmq.host=${BE_BROKER_HOST}
spring.rabbitmq.port=${BE_BROKER_PORT}
spring.rabbitmq.username=${BE_BROKER_USER}
spring.rabbitmq.password=${BE_BROKER_PASSWORD}

